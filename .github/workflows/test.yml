name: test

on:
  push:
  pull_request:

jobs:
  security-knowledge-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate knowledge-base CSV files
        run: python src/code-security/scripts/validate_data.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
